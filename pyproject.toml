[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-car"
version = "1.2.0"
description = "Voice-controlled Raspberry Pi ground robot with a hard-real-time safety MCU"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Runtime dependencies are intentionally NOT declared here. Services run in
# separate environments (or containers) with conflicting native dependencies --
# onnxruntime, ctranslate2 and the Azure Speech SDK do not belong in one
# resolver. See requirements-*.txt, one per service role.
dependencies = []

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# Makes `import src.*` work without installing the package or setting
# PYTHONPATH by hand.
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
